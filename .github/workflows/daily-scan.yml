name: Borsify Daily Scan

on:
  schedule:
    # 16:45 UTC = 18:45 svensk sommartid / 17:45 svensk vintertid.
    - cron: "45 16 * * 1-5"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python daily_scan.py
        env:
          BORSIFY_SUPABASE_URL: ${{ secrets.BORSIFY_SUPABASE_URL }}
          BORSIFY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BORSIFY_SUPABASE_SERVICE_ROLE_KEY }}
          BORSIFY_RESEND_API_KEY: ${{ secrets.BORSIFY_RESEND_API_KEY }}
          BORSIFY_EMAIL_FROM: ${{ secrets.BORSIFY_EMAIL_FROM }}
          BORSIFY_DAILY_PROFILE: Balanserad
          BORSIFY_APP_URL: https://borsify.se
