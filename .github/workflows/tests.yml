name: Regression checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.12'
            lock: requirements-py312.lock
          - python: '3.14'
            lock: requirements-py314.lock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r ${{ matrix.lock }} pytest==9.1.1
      - run: python -m pytest -q
      - run: python -m compileall -q .
      - run: git diff --check
