[theme]
base = "dark"
primaryColor = "#4FD1A1"
backgroundColor = "#0B1117"
secondaryBackgroundColor = "#121B24"
textColor = "#F2F5F7"
font = "sans serif"
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#0E161E"
secondaryBackgroundColor = "#121B24"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[server]
headless = true

[runner]
fastReruns = true
